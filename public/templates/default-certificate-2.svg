<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1414" width="2000" height="1414">
  <defs>
    <linearGradient id="headerBand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <pattern id="gridFine" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#0284C7" stroke-opacity="0.04" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="2000" height="1414" fill="#F8FBFF" />
  <rect width="2000" height="1414" fill="url(#gridFine)" />

  <!-- Outer Card Frame -->
  <rect x="56" y="56" width="1888" height="1302" rx="22" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="3" />
  <rect x="56" y="56" width="1888" height="22" rx="11" fill="url(#headerBand)" />

  <!-- Geometric Decorative Accents -->
  <circle cx="1840" cy="180" r="140" fill="#E0F2FE" fill-opacity="0.55" />
  <circle cx="160" cy="1240" r="160" fill="#EBF5FF" fill-opacity="0.7" />

  <!-- Header Badge -->
  <g transform="translate(1000, 175)">
    <rect x="-200" y="-32" width="400" height="50" rx="25" fill="#EBF5FF" stroke="#BAE6FD" stroke-width="2" />
    <text x="0" y="2" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" letter-spacing="3.5" fill="#0369A1">SERTIFIKAT KELULUSAN WORKSHOP</text>
  </g>

  <text x="1000" y="295" text-anchor="middle" font-family="sans-serif" font-size="64" font-weight="800" letter-spacing="2" fill="#0F172A">PIAGAM KOMPETENSI</text>
  <line x1="780" y1="330" x2="1220" y2="330" stroke="#0284C7" stroke-width="4" stroke-linecap="round" />

  <text x="1000" y="525" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="500" fill="#64748B">Dengan bangga diberikan kepada:</text>
  <line x1="460" y1="735" x2="1540" y2="735" stroke="#E2E8F0" stroke-width="3" />

  <text x="1000" y="905" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="500" fill="#475569">Telah menyelesaikan seluruh sesi pembelajaran dan praktik workshop resmi</text>
  <text x="1000" y="950" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="400" fill="#64748B">dengan verifikasi kehadiran digital terenkripsi melalui platform VeriCert.</text>

  <!-- Signature -->
  <g transform="translate(220, 1110)">
    <path d="M12 45 Q65 5 110 38 T215 24 T310 32" fill="none" stroke="#0284C7" stroke-width="4" stroke-linecap="round" />
    <line x1="0" y1="68" x2="360" y2="68" stroke="#CBD5E1" stroke-width="2" />
    <text x="0" y="108" font-family="sans-serif" font-size="26" font-weight="700" fill="#0F172A">Koordinator Program</text>
    <text x="0" y="142" font-family="sans-serif" font-size="20" font-weight="500" fill="#64748B">Penyelenggara Resmi Workshop</text>
  </g>

  <!-- QR Frame -->
  <g transform="translate(1590, 990)">
    <rect x="0" y="0" width="250" height="295" rx="16" fill="#F8FBFF" stroke="#BAE6FD" stroke-width="2" />
    <text x="125" y="272" text-anchor="middle" font-family="monospace" font-size="17" font-weight="600" fill="#0284C7">VERIFIKASI QR</text>
  </g>
</svg>
